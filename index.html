<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula_19_03</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div id="root"></div> <!--div onde o react será renderizado-->

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script> <!--bibliotecas do react--> 
    
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script> <!--react DOM faz a ponte emtre o react e o DOM do navegador-->

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script> <!--babel para transpilar JSX-->
    <script src="https://unpkg.com/styled-components/dist/styled-components.min.js"></script>


    <script type="text/babel">

        function ListaComDescricao(){

            const itens = [
            {id: 1, titulo: 'Primeiro', descricao: 'Descrição 1'},
            {id: 1, titulo: 'Primeiro', descricao: 'Descrição 1'},
            {id: 1, titulo: 'Primeiro', descricao: 'Descrição 1'}

       ] 

            return (
                <dl>
                    {itens.map(item => (
                        <React.Fragment key={item.id}>
                            <dt>{item.titulo}</dt>
                            <dd>{item.descricao}</dd>
                        </React.Fragment>
                    ))}
                </dl>
            );

        }

    
        ReactDOM.createRoot(document.getElementById('root')).render
        (<ListaComDescricao />);

            

    </script>
</body>
</html>
