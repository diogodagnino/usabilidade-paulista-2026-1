<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula_19_03</title>
</head>
<body>

    <div id="root"></div> <!--div onde o react será renderizado-->

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script> <!--bibliotecas do react--> 
    
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script> <!--react DOM faz a ponte emtre o react e o DOM do navegador-->

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script> <!--babel para transpilar JSX-->

    <script type="text/babel">

       ReactDOM.createRoot(document.getElementById('root')).render(
        <h1>Olá mundo </h1>
       );



    </script>
</body>
</html>
